  <text x="170" y="170" fill="#8FA0FF" font-family="sans-serif" font-size="14" letter-spacing="2">TOTAL PORTFOLIO VALUE</text>
  <text x="170" y="225" fill="#EFF1EC" font-family="sans-serif" font-size="42" font-weight="600">$184,920.45</text>
  <path d="M170 270 Q 230 240, 290 260 T 410 230" fill="none" stroke="#3355FF" stroke-width="4"/>

  <!-- UI Card 2 -->
  <rect x="510" y="120" width="550" height="435" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="550" y="170" fill="#6B6F68" font-family="sans-serif" font-size="14" letter-spacing="2">ANALYTICS &amp; VOLUME</text>

  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- UI Card 1 -->
  <rect x="100" y="80" width="1000" height="515" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

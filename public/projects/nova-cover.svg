      <stop offset="0%" stop-color="#0d111a"/>
      <stop offset="50%" stop-color="#161b26"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3355FF" stop-opacity="0.25"/>

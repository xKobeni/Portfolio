<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d111a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0e1520;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2240;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#111930;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3355FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8FA0FF;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="balanceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e32a0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3355FF;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="sparkFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8FA0FF;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#3355FF;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3355FF;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#3355FF;stop-opacity:0"/>
    </radialGradient>
    <clipPath id="phoneClip">
      <rect x="100" y="40" width="600" height="820" rx="48"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="900" fill="url(#bgGrad)"/>

  <!-- Phone shell -->
  <rect x="96" y="36" width="608" height="828" rx="52" fill="#0a0d14" stroke="#2a3450" stroke-width="2"/>
  <!-- Phone inner -->
  <rect x="100" y="40" width="600" height="820" rx="48" fill="#0d111a" clip-path="url(#phoneClip)"/>

  <!-- Status bar -->
  <text x="130" y="78" font-family="sans-serif" font-size="12" font-weight="600" fill="#EFF1EC">9:41</text>
  <rect x="340" y="52" width="120" height="28" rx="14" fill="#0a0d14"/>
  <text x="660" y="78" font-family="sans-serif" font-size="10" fill="#EFF1EC" text-anchor="end">●●● ▶ 87%</text>

  <!-- Header -->
  <text x="400" y="120" font-family="sans-serif" font-size="11" fill="#6B6F68" text-anchor="middle" letter-spacing="3">NOVA FINANCE</text>
  <text x="400" y="148" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="18" font-weight="600" fill="#EFF1EC" text-anchor="middle">Good morning, John</text>
  <circle cx="400" cy="172" r="3" fill="#3355FF" filter="url(#glow)"/>

  <!-- Main balance card -->
  <rect x="124" y="196" width="552" height="240" rx="24" fill="url(#balanceBg)"/>
  <!-- Card glow overlay -->
  <rect x="124" y="196" width="552" height="240" rx="24" fill="url(#glowCenter)" opacity="0.6"/>
  <!-- Card top stripe -->
  <rect x="124" y="196" width="552" height="4" rx="2" fill="#8FA0FF" opacity="0.6"/>
  <!-- Stars/dots decoration -->
  <circle cx="600" cy="230" r="2" fill="white" opacity="0.4"/>
  <circle cx="630" cy="250" r="1.5" fill="white" opacity="0.3"/>
  <circle cx="618" cy="270" r="1" fill="white" opacity="0.2"/>
  <circle cx="155" cy="390" r="60" fill="#3355FF" fill-opacity="0.1" filter="url(#softGlow)"/>
  <circle cx="640" cy="220" r="40" fill="#8FA0FF" fill-opacity="0.08" filter="url(#softGlow)"/>

  <text x="160" y="238" font-family="sans-serif" font-size="11" fill="#D8DEFF" letter-spacing="2" opacity="0.8">TOTAL BALANCE</text>
  <text x="160" y="295" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="52" font-weight="700" fill="white">$84,291</text>
  <text x="160" y="322" font-family="sans-serif" font-size="20" font-weight="300" fill="#D8DEFF" opacity="0.7">.49 USD</text>

  <!-- Change badge -->
  <rect x="160" y="340" width="100" height="28" rx="8" fill="rgba(0,212,170,0.2)"/>
  <text x="210" y="358" font-family="sans-serif" font-size="11" fill="#00d4aa" text-anchor="middle" font-weight="600">▲ +$2,640</text>

  <!-- Card number dots -->
  <circle cx="400" cy="408" r="3" fill="white" opacity="0.4"/>
  <circle cx="412" cy="408" r="3" fill="white" opacity="0.4"/>
  <circle cx="424" cy="408" r="3" fill="white" opacity="0.4"/>
  <circle cx="436" cy="408" r="3" fill="white" opacity="0.4"/>
  <text x="510" y="412" font-family="'Courier New', monospace" font-size="12" fill="white" opacity="0.6">4291</text>

  <!-- Quick actions row -->
  <text x="160" y="464" font-family="sans-serif" font-size="11" fill="#6B6F68" letter-spacing="1">QUICK ACTIONS</text>
  <!-- Send button -->
  <rect x="124" y="478" width="124" height="68" rx="16" fill="#141c2e"/>
  <circle cx="186" cy="500" r="14" fill="#3355FF" fill-opacity="0.2"/>
  <text x="186" y="506" font-family="sans-serif" font-size="13" fill="#8FA0FF" text-anchor="middle">↑</text>
  <text x="186" y="530" font-family="sans-serif" font-size="11" fill="#EFF1EC" text-anchor="middle">Send</text>
  <!-- Receive button -->
  <rect x="264" y="478" width="124" height="68" rx="16" fill="#141c2e"/>
  <circle cx="326" cy="500" r="14" fill="#3355FF" fill-opacity="0.2"/>
  <text x="326" y="506" font-family="sans-serif" font-size="13" fill="#8FA0FF" text-anchor="middle">↓</text>
  <text x="326" y="530" font-family="sans-serif" font-size="11" fill="#EFF1EC" text-anchor="middle">Receive</text>
  <!-- Pay button -->
  <rect x="404" y="478" width="124" height="68" rx="16" fill="#141c2e"/>
  <circle cx="466" cy="500" r="14" fill="#3355FF" fill-opacity="0.2"/>
  <text x="466" y="506" font-family="sans-serif" font-size="13" fill="#8FA0FF" text-anchor="middle">⊕</text>
  <text x="466" y="530" font-family="sans-serif" font-size="11" fill="#EFF1EC" text-anchor="middle">Add Funds</text>
  <!-- More button -->
  <rect x="544" y="478" width="132" height="68" rx="16" fill="#141c2e"/>
  <circle cx="610" cy="500" r="14" fill="#3355FF" fill-opacity="0.2"/>
  <text x="610" y="506" font-family="sans-serif" font-size="13" fill="#8FA0FF" text-anchor="middle">···</text>
  <text x="610" y="530" font-family="sans-serif" font-size="11" fill="#EFF1EC" text-anchor="middle">More</text>

  <!-- Sparkline chart section -->
  <text x="160" y="580" font-family="sans-serif" font-size="11" fill="#6B6F68" letter-spacing="1">30-DAY ACTIVITY</text>
  <rect x="124" y="595" width="552" height="160" rx="16" fill="#111827"/>

  <!-- Chart Y-axis labels -->
  <text x="144" y="620" font-family="'Courier New', monospace" font-size="9" fill="#6B6F68">$90k</text>
  <text x="144" y="660" font-family="'Courier New', monospace" font-size="9" fill="#6B6F68">$85k</text>
  <text x="144" y="700" font-family="'Courier New', monospace" font-size="9" fill="#6B6F68">$80k</text>
  <text x="144" y="738" font-family="'Courier New', monospace" font-size="9" fill="#6B6F68">$75k</text>

  <!-- Horizontal grid lines -->
  <line x1="172" y1="615" x2="660" y2="615" stroke="#1e2a42" stroke-width="1"/>
  <line x1="172" y1="655" x2="660" y2="655" stroke="#1e2a42" stroke-width="1"/>
  <line x1="172" y1="695" x2="660" y2="695" stroke="#1e2a42" stroke-width="1"/>
  <line x1="172" y1="735" x2="660" y2="735" stroke="#1e2a42" stroke-width="1"/>

  <!-- Sparkline path -->
  <polygon points="172,720 202,710 232,718 262,695 292,700 322,680 352,688 382,665 412,672 442,648 472,660 502,640 532,645 562,625 592,632 622,618 652,620 662,622 662,748 172,748" fill="url(#sparkFill)"/>
  <polyline points="172,720 202,710 232,718 262,695 292,700 322,680 352,688 382,665 412,672 442,648 472,660 502,640 532,645 562,625 592,632 622,618 652,620" fill="none" stroke="#8FA0FF" stroke-width="2.5" filter="url(#glow)" stroke-linejoin="round"/>

  <!-- Highlight dot -->
  <circle cx="652" cy="620" r="6" fill="#3355FF" filter="url(#glow)"/>
  <circle cx="652" cy="620" r="3" fill="white"/>

  <!-- Tooltip -->
  <rect x="590" y="595" width="80" height="30" rx="6" fill="#3355FF"/>
  <text x="630" y="614" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="600">$84,291</text>

  <!-- Bottom tab bar -->
  <rect x="100" y="800" width="600" height="60" fill="#0d111a"/>
  <rect x="100" y="800" width="600" height="1" fill="#1e2a42"/>
  <!-- Home tab (active) -->
  <rect x="160" y="818" width="44" height="4" rx="2" fill="url(#blueGrad)"/>
  <text x="182" y="842" font-family="sans-serif" font-size="9" fill="#3355FF" text-anchor="middle">Home</text>
  <!-- Other tabs -->
  <text x="310" y="826" font-family="sans-serif" font-size="16" fill="#6B6F68" text-anchor="middle">◎</text>
  <text x="310" y="842" font-family="sans-serif" font-size="9" fill="#6B6F68" text-anchor="middle">Analytics</text>
  <text x="460" y="826" font-family="sans-serif" font-size="16" fill="#6B6F68" text-anchor="middle">⊞</text>
  <text x="460" y="842" font-family="sans-serif" font-size="9" fill="#6B6F68" text-anchor="middle">Cards</text>
  <text x="610" y="826" font-family="sans-serif" font-size="16" fill="#6B6F68" text-anchor="middle">☰</text>
  <text x="610" y="842" font-family="sans-serif" font-size="9" fill="#6B6F68" text-anchor="middle">Settings</text>

  <!-- Home indicator -->
  <rect x="320" y="860" width="160" height="5" rx="3" fill="#2a3450"/>
</svg>

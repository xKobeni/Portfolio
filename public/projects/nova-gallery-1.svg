  <rect x="426" y="168" width="346" height="220" rx="16" fill="url(#cardGrad1)" filter="url(#cardShadow)"/>
  <rect x="426" y="168" width="346" height="220" rx="16" fill="none" stroke="#8FA0FF" stroke-width="1" opacity="0.2"/>

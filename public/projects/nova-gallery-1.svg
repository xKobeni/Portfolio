  <text x="100" y="67" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#EFF1EC" letter-spacing="2">NOVA</text>
  <rect x="200" y="49" width="70" height="26" rx="6" fill="#3355FF" fill-opacity="0.2"/>
  <text x="235" y="66" font-family="sans-serif" font-size="11" fill="#8FA0FF" text-anchor="middle">Dashboard</text>
  <text x="290" y="66" font-family="sans-serif" font-size="11" fill="#6B6F68">Analytics</text>

  <text x="84" y="213" font-family="sans-serif" font-size="14" fill="#8FA0FF" text-anchor="middle">$</text>
  <text x="108" y="208" font-family="sans-serif" font-size="11" fill="#6B6F68">Total Balance</text>
  <text x="68" y="250" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="36" font-weight="700" fill="#EFF1EC">$84,291</text>
  <text x="68" y="272" font-family="sans-serif" font-size="11" fill="#00d4aa">.49</text>
